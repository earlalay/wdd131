<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Form</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
</head>
<body>
    <main class="wrapper">
        <h1>Event Ticket</h1>
        <form id="eventForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" require />
            </div>
            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" require />
            </div>
            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" require />
            </div>
            <div class="field">
                <label for="personType">Type</label>
                <select id="personType"
                       name="personType"
                       aria-controls="typeContainer"4
                       required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>
            <div class="field">
                <label for="eventDate">Event Date</label>
                <input id="eventDate" name="eventDate" type="date" required />
            </div>
            <button class="full" type="submit">Create Ticket</button>
        </form>
    </main>
</body>
</html>
