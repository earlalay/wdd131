<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="recipes.css">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>
<body>
    <header>
        <div class="page-title">
            <img src="images/recipe-book.png" alt="recipe book icon">
            <h1>RECIPEBOOK</h1>
        </div>
        <div id="search-bar">
            <form>
                <input type="text" placeholder="Find a recipe">
            </form>
            <img src="images/search-icon.svg" alt="search icon">
        </div>
    </header>
    <main>
        <hr>
        <div class="recipe-card">
            <img src="images/apple-crisp.jpg" alt="apple crisp with ice cream">
            <button>dessert</button>
            <h2>APPLE CRISP</h2>
            <span class="rating" role="img"
            aria-label="Rating: 4 out of 5 stars">
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span> 
            <p class="description hidden">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
        </div>
    </main>
    <footer>
        <div class="socials">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="https://www.instagram.com"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="https://www.youtube.com"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="https://www.pinterest.com"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a id="recipe-icon-credit" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>  
    </footer>
</body>
</html>
